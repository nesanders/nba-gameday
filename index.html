<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NBA Gameday</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<style>
:root{--bg:#fff;--fg:#151515;--muted:#6b6b6b;--line:#e4e4e4;--card:#f4f4f5;--accent:#1d6fe0;--live:#d42020;--hl:#fff3b8;--fol:#eaf1fd;--hh:0px}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f10;--fg:#ececec;--muted:#9a9a9a;--line:#2a2a2c;--card:#1a1a1c;--accent:#6ea8ff;--live:#ff5c5c;--hl:#4a4010;--fol:#16233a}}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* display rules elsewhere must never override the hidden attribute */
body{margin:0;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding:0 .6rem}
.muted{color:var(--muted)}
button,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.2rem .55rem;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.4rem;padding:.4rem 0;flex-wrap:wrap}
.bar h1{font-size:1rem;margin:0;white-space:nowrap}
.bar h1 a:hover{text-decoration:none}
.bar .sp{flex:1}
.bar .sm{display:none}
#day{font-variant-numeric:tabular-nums;min-width:6.2em;text-align:center;color:var(--muted)}
#games{display:flex;gap:.4rem;overflow-x:auto;padding:0 0 .45rem;scrollbar-width:thin}
.g{flex:0 0 auto;min-width:118px;text-align:left;padding:.3rem .5rem;font-variant-numeric:tabular-nums;font-size:13px}
.g .t{display:flex;justify-content:space-between;gap:.6rem}
.hm{display:inline-block;width:.85em;color:var(--muted);font-weight:400;font-size:.9em}
.tm .hm,.th .hm{width:auto;margin-right:-.3rem}
.g .s{font-size:11px;color:var(--muted)}
.g.live .s{color:var(--live);font-weight:600}
.g[aria-current=true]{outline:2px solid var(--accent);outline-offset:-1px}
/* settings panel */
#settings{margin:.1rem 0 .6rem;padding:.55rem .75rem .7rem;max-height:70vh;overflow-y:auto;font-size:13px;background:var(--card);border:1px solid var(--muted);border-top:3px solid var(--accent);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#settings .sethead{display:flex;align-items:center;justify-content:space-between;margin:0 0 .45rem}
#settings .sethead h2{font-size:13px;margin:0}
#settings select,#settings button{background:var(--bg)}
#settings button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.35rem .9rem;align-items:center}
.setgrid label{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.setgrid label.ck{justify-content:flex-start}
#usage{margin-top:.55rem;font-variant-numeric:tabular-nums}
#usage table{font-size:12.5px;margin:.25rem 0}
#usage th,#usage td{padding:.15rem .5rem .15rem 0;border-bottom:1px solid var(--line);background:none;cursor:default}
#usage table{width:100%;max-width:560px}
#usage th:first-child,#usage td:first-child{text-align:left;white-space:normal}
#usage td .sub{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.setgrid>button{justify-self:start}
#usage p{margin:.25rem 0}
#usage .now{font-weight:600}
@media (max-width:520px){.bar .lt{display:none}.bar .lg{display:none}.bar .sm{display:inline}.bar{gap:.2rem}.bar button{padding:.2rem .35rem;font-size:13px}#day{min-width:3.6em}}

main{padding-top:.6rem;padding-bottom:1.5rem}
.status{font-size:12px;color:var(--muted);margin:.3rem 0;min-height:1em}
.status.err{color:var(--live)}

/* score header */
#score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:.55rem;background:var(--card);border-radius:10px;text-align:center}
#score .tm{display:flex;align-items:baseline;justify-content:center;gap:.5rem;flex-wrap:wrap}
#score .ab{font-weight:700;border-bottom:3px solid var(--c,transparent)}
#score .nm{font-size:12px;color:var(--muted)}
#score .pts{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#score .mid{font-size:13px;color:var(--muted)}
#score .mid.live{color:var(--live);font-weight:600}

/* game view layout: tabs on mobile, side by side on desktop */
#tabs{margin:.5rem 0 0}
#panes{display:grid;gap:1rem;margin-top:.4rem}
#panes>*{min-width:0}   /* else a wide box score widens the grid (and the page) instead of scrolling inside .tw */
@media (max-width:999px){
  #gameView[data-tab=plays] #boxPane,#gameView[data-tab=box] #playsPane{display:none}
}
@media (min-width:1000px){
  #tabs{display:none}
  #panes{grid-template-columns:minmax(300px,390px) minmax(0,1fr);align-items:start}
  #playsPane{position:sticky;top:calc(var(--hh) + .5rem);max-height:calc(100vh - var(--hh) - 1rem);overflow-y:auto;padding-right:.25rem}
}
.controls{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.1rem 0 .4rem}
.controls .sp{flex:1}

/* plays */
.per h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.7rem 0 .15rem;padding-bottom:.2rem;border-bottom:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}
.p{display:grid;grid-template-columns:2.9em 2.7em 1fr auto;gap:.4rem;align-items:baseline;padding:.25rem .2rem;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.p .clk{color:var(--muted);font-size:12px}
.p .tm{font-size:11px;font-weight:700;border-left:3px solid var(--c,transparent);padding-left:.3rem}
.p .sc{font-size:12px;color:var(--muted);white-space:nowrap}
.p.scoring .tx{font-weight:600}
.p.scoring .sc{color:var(--fg);font-weight:600}
.p .v{font-size:10px;font-weight:700;color:var(--accent);margin-left:.3rem}
.new{animation:hl 4s ease-out}
@keyframes hl{from{background:var(--hl)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.empty{color:var(--muted);text-align:center;padding:1.5rem 0}

/* box score */
.boxbar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.1rem 0 .4rem;font-size:13px}
.tw,.tw0{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:.6rem;scrollbar-width:thin}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:.18rem .3rem;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);background:var(--card);cursor:help}
.bx thead th{cursor:pointer;user-select:none}
.bx thead th:hover{color:var(--fg)}
.bx thead th[aria-sort]{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.bx thead th:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bx td.gs{color:var(--muted);text-align:center}
.bx{table-layout:fixed}
.bx td,.bx th{overflow:hidden;text-overflow:ellipsis}
.bx th:first-child,.bx td:first-child,.ff th:first-child,.ff td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--bg)}
.bx thead th:first-child,.ff thead th:first-child{background:var(--card)}
.bx tbody tr:hover td{background:var(--card)}
.bx .a0{border-left:2px solid var(--line)}
.bx tr.b0 td{border-top:2px solid var(--line)}
.bx tfoot td{font-weight:600;background:var(--card);border-bottom:0}
.bx td.k{font-weight:700}
.bx .pos{color:var(--muted);font-size:10.5px;margin-left:.25rem}
.th{display:flex;align-items:baseline;gap:.5rem;margin:.2rem 0 .3rem;font-size:13px}
.th .ab{font-weight:700;border-bottom:3px solid var(--c,transparent)}
.th .pts{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.dnp{font-size:12px;color:var(--muted);margin:-.3rem 0 .8rem}

/* leaders */
#leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem}

/* home */
.hh{display:flex;align-items:center;gap:.6rem;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.8rem 0 .35rem}
.hh button{font-size:12px;text-transform:none;letter-spacing:0}
#homeLeaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
#gameView[data-mode=list] #score,#gameView[data-mode=list] #tabs,#gameView[data-mode=list] #panes,#gameView[data-mode=game] #gameList{display:none}
#homeGames,#gameList{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.6rem}
@media (max-width:700px){#homeView{display:flex;flex-direction:column}#homeStatus{order:-2}#hGames{order:-1}}   /* phones: games first */
.gc{border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem .5rem;cursor:pointer;font-size:13px;min-width:0}
.gc:hover,.gc:focus-visible{border-color:var(--accent);outline:none}
.gc .st{font-size:11.5px;color:var(--muted);margin-bottom:.15rem}
.gc.live .st{color:var(--live);font-weight:600}
.gc table.ls{width:100%;font-size:12.5px}
.ls th,.ls td{padding:.12rem .3rem;background:none;cursor:inherit}
.ls th:first-child,.ls td:first-child{text-align:left;width:100%}
.ls .ab{font-weight:700;border-left:3px solid var(--c,transparent);padding-left:.3rem}
.ls .rec{color:var(--muted);font-size:11px;margin-left:.35rem;font-weight:400}
.ls td.t{font-weight:700}
.ls th:not(:first-child),.ls td:not(:first-child){min-width:2em}
.ls tr:last-child td{border-bottom:0}
.gc .pl{display:grid;grid-template-columns:2.7em 1fr;gap:.1rem .3rem;font-size:12px;margin-top:.35rem;line-height:1.35}
.gc .pl .ab{font-weight:700;font-size:11px}
.gc .pl .who{min-width:0;display:flex;flex-wrap:wrap;column-gap:.35rem}
.gc .pl .pp{white-space:nowrap}
.gc .pl .pp:not(:last-child)::after{content:" ·";color:var(--muted)}
.card{border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 .25rem}
.card li{display:grid;grid-template-columns:1.3em 1fr auto;gap:.4rem;align-items:baseline;padding:.2rem 0;border-bottom:1px solid var(--line);font-size:13px}
.card li:last-child{border-bottom:0}
.card .rk{color:var(--muted);font-size:11px}
.card .val{font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{display:block;font-size:11px;color:var(--muted)}
.card li.go{grid-template-columns:1.3em 1fr auto .7em;cursor:pointer;border-radius:4px}
.card li.fol{background:var(--fol)}

/* season tables */
#seasonView .controls{gap:.4rem}
#seasonView input[type=search]{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.2rem .5rem;width:9em}
#seasonView .ck{display:inline-flex;align-items:center;gap:.25rem;font-size:13px}
.stw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;scrollbar-width:thin}
table.st{min-width:100%}
.st th,.st td{padding:.2rem .4rem}
.st th:first-child,.st td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--bg);max-width:12em;overflow:hidden;text-overflow:ellipsis}
.st thead th{cursor:pointer;user-select:none}
.st thead th:first-child{background:var(--card)}
.st thead th:hover{color:var(--fg)}
.st thead th[aria-sort]{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.st td.l,.st th.l{text-align:left}
.st td.k{font-weight:700}
.st td .rk{display:inline-block;min-width:1.9em;color:var(--muted);font-size:11px}
.st td .mu{color:var(--muted)}
.st tbody tr.go{cursor:pointer}
.st tbody tr:hover td{background:var(--card)}
.st tbody tr.fol td{background:var(--fol)}
.card li.go:hover,.card li.go:focus-visible{background:var(--card);outline:none}
.follow{grid-column:1/-1}
.follow .teams{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.follow .teams button{min-width:3.4em;padding:.15rem .35rem;font-size:12px}
.card li.go:hover .mu,.card li.go:focus-visible .mu{color:var(--accent);text-decoration:underline}
.card .chev{color:var(--muted);font-size:15px;line-height:1}
.card li.go:hover .chev{color:var(--accent)}
.dot{color:var(--live)}

footer{font-size:11px;color:var(--muted);text-align:center;padding:.5rem 0 1.5rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <h1><a href="./" id="logo" title="Home: all games and top performers">🏀<span class="lt"> NBA Gameday</span></a></h1>
      <span class="seg" role="group" aria-label="View">
        <button id="navGame" aria-pressed="true">Games</button>
        <button id="navLeaders" aria-pressed="false"><span class="lg">Top performers</span><span class="sm">Leaders</span></button>
        <button id="navSeason" aria-pressed="false">Season</button>
      </span>
      <span class="sp"></span>
      <button id="prev" aria-label="Previous day">‹</button>
      <span id="day">Today</span>
      <button id="next" aria-label="Next day">›</button>
      <button id="today" hidden>Today</button>
      <button id="gear" aria-label="Settings" aria-expanded="false" aria-controls="settings" title="Refresh speed &amp; data usage">⚙</button>
    </div>
    <div id="settings" hidden role="region" aria-label="Refresh speed and data usage">
      <div class="sethead"><h2>Refresh speed &amp; data usage</h2><button id="setClose" aria-label="Close settings">✕</button></div>
      <div class="setgrid" id="setControls"></div>
      <div id="usage"></div>
    </div>
    <div id="games" role="list" aria-label="Games"></div>
  </div>
</header>

<main class="wrap">
  <!-- ===== game view ===== -->
  <section id="gameView" data-tab="plays" data-mode="list">
    <div id="score" hidden aria-live="polite"></div>
    <p class="status" id="status"></p>
    <div id="gameList"></div>
    <div id="tabs" class="seg" role="tablist">
      <button data-tab="plays" aria-pressed="true">Play-by-play</button>
      <button data-tab="box" aria-pressed="false">Box score</button>
    </div>
    <div id="panes">
      <div id="playsPane">
        <div class="controls" id="controls" hidden>
          <span id="filters" class="seg"></span>
          <select id="period" aria-label="Period"><option value="all">All</option></select>
          <span class="sp"></span>
          <button id="order" title="Toggle play order">Newest first</button>
        </div>
        <div id="list"></div>
        <p class="empty" id="empty" hidden>No plays yet.</p>
      </div>
      <div id="boxPane">
        <div class="boxbar"><span class="muted">Top:</span><span id="topSel" class="seg"></span><span class="muted" id="boxAge"></span></div>
        <div id="box"></div>
      </div>
    </div>
  </section>

  <!-- ===== home view ===== -->
  <section id="homeView" hidden>
    <p class="status" id="homeStatus"></p>
    <div id="hLead">
      <h2 class="hh">Top performers <button id="allLeaders">All categories →</button></h2>
      <div id="homeLeaders"></div>
    </div>
    <div id="hGames">
      <h2 class="hh">Games</h2>
      <div id="homeGames"></div>
    </div>
  </section>

  <!-- ===== season view ===== -->
  <section id="seasonView" hidden>
    <div class="controls">
      <span class="seg" id="seasonTabs" role="tablist">
        <button data-s="avg" aria-pressed="true">Per game</button>
        <button data-s="pg" aria-pressed="false">Player games</button>
        <button data-s="tg" aria-pressed="false">Team games</button>
      </span>
      <select id="seasonTeam" aria-label="Team"></select>
      <input id="seasonFind" type="search" placeholder="Player" aria-label="Find a player" autocomplete="off">
      <label class="ck" id="seasonAllWrap"><input type="checkbox" id="seasonAll"> All players</label>
    </div>
    <p class="status" id="seasonStatus"></p>
    <div id="seasonTable"></div>
  </section>

  <!-- ===== top performers view ===== -->
  <section id="leadersView" hidden>
    <p class="status" id="ldStatus"></p>
    <div id="leaders"></div>
  </section>
</main>

<footer>Data from ESPN's public (unofficial) API · Advanced stats computed in-browser (Basketball-Reference formulas) · Not affiliated with the NBA, ESPN or Sports Reference</footer>

<script>
'use strict';
const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const CORE = 'https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/';
const MS = { preSb: 300000, prePbp: 60000, err: 30000 };
const LEADER_CONCURRENCY = 3;
const PAGE = 25;              // plays per lightweight page request
const FULL_GAME_MIN = 135;    // a live NBA game lasts ~2h15m of wall-clock time

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* full or blocked */ } },
};

// user-adjustable refresh intervals, in seconds (settings panel)
const DEFAULTS = { live: 10, box: 60, others: 60, leaders: 300, breaks: true, lite: true, follow: ['LAL', 'SA', 'PHI'] };
// ESPN team abbreviations (Spurs are SA, Pelicans NO, Knicks NY, Warriors GS, Jazz UTAH, Wizards WSH)
const TEAMS = ['ATL', 'BOS', 'BKN', 'CHA', 'CHI', 'CLE', 'DAL', 'DEN', 'DET', 'GS', 'HOU', 'IND', 'LAC', 'LAL', 'MEM',
  'MIA', 'MIL', 'MIN', 'NO', 'NY', 'OKC', 'ORL', 'PHI', 'PHX', 'POR', 'SAC', 'SA', 'TOR', 'UTAH', 'WSH'];
// Saved as differences from DEFAULTS (v:2), so changing a default reaches everyone who didn't pick that value.
// Older saves stored every value; their leaders: 60 was the old default, not a choice.
const savedSettings = store.get('nbapbp.settings') || {};
if (!savedSettings.v && savedSettings.leaders === 60) delete savedSettings.leaders;
delete savedSettings.v;
const settings = { ...DEFAULTS, ...savedSettings };
const saveSettings = () => store.set('nbapbp.settings',
  Object.fromEntries([['v', 2], ...Object.entries(settings).filter(([k, v]) => JSON.stringify(v) !== JSON.stringify(DEFAULTS[k]))]));
const followed = t => !!t && settings.follow.includes(t.abbr ?? t);
// games involving a followed team first, otherwise scoreboard order (by tip-off)
const orderedGames = () => state.games.filter(g => followed(g.away) || followed(g.home))
  .concat(state.games.filter(g => !followed(g.away) && !followed(g.home)));
const sec = k => settings[k] * 1000;

const state = {
  view: 'home',      // 'home' | 'game' | 'leaders'
  tab: 'plays',      // mobile tab in game view
  date: null,        // YYYYMMDD; null = ESPN's "today"
  dayDate: null,     // YYYY-MM-DD reported by ESPN
  games: [],
  gameId: null, gameState: null, statusName: '', clock: '', detail: '', sbError: false,
  away: null, home: null,
  plays: [], filter: 'all', period: 'all', newest: true,
  box: null,
  top: store.get('nbapbp.top'),   // team abbreviation the user wants on top
  sort: { key: 'GS', dir: -1 },    // box score sort { key: column header, dir: 1 asc | -1 desc }: starters, then GmSc
};
const timers = { sb: 0, pbp: 0, ld: 0 };
const due = {};                   // timer key -> { fn, at } for pending timers, so a settings change can re-time them
function sched(k, fn, ms) { clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); due[k] = { fn, at: Date.now() + ms }; }
function stop(k) { clearTimeout(timers[k]); delete due[k]; }
// per selected game: when the box was last fetched, whether plays arrived since, how long nothing has changed
let live = {};
const resetLive = () => (live = { lastBox: 0, dirty: false, idle: 0, sig: '', mode: 'live', liteFails: 0 });
resetLive();
const leaders = new Map();        // gameId -> { final, rows }
let sections = new Map(), periodCount = 0, filterKey = '';

// ---------------------------------------------------------------- fetching
// Typical compressed response sizes in bytes (measured Nov 2026); replaced by a running average of what we see.
const SIZE = { summary: 34000, plays: 2300, status: 300, scoreboard: 13000, ...(store.get('nbapbp.sizes') || {}) };
const usage = { bytes: 0, requests: 0, total: store.get('nbapbp.usage') || { since: Date.now(), bytes: 0 } };

async function getJSON(url, kind, cache = 'no-store') {
  // 'no-store': responses have no ETag/Last-Modified (no 304s possible) and the core API allows
  // stale-while-revalidate, so a cached copy could be served stale. (Cache modes don't trigger a CORS preflight.)
  const r = await fetch(url, { cache });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const text = await r.text();
  // Content-Length is CORS-safelisted; for gzip responses it is the on-the-wire size. Fallback: typical ~9:1 gzip ratio.
  const bytes = +r.headers.get('content-length') || Math.round(text.length * 0.11);
  usage.bytes += bytes; usage.requests++; usage.total.bytes += bytes;
  store.set('nbapbp.usage', usage.total);
  if (kind) { SIZE[kind] = Math.round(0.7 * SIZE[kind] + 0.3 * bytes); store.set('nbapbp.sizes', SIZE); }
  if (!$('#settings').hidden) renderUsage();
  return JSON.parse(text);
}
const summaryUrl = id => API + '/summary?event=' + id;
const coreUrl = (id, path) => CORE + id + '/competitions/' + id + '/' + path;
const refId = (ref, kind) => (String(ref || '').match(new RegExp('/' + kind + '/(\\d+)')) || [])[1] || null;
const bbref = name => 'https://www.basketball-reference.com/search/search.fcgi?search=' + encodeURIComponent(name);

function team(c) {
  const t = c.team || {};
  // the summary header's team objects have `name` ("Heat") but no shortDisplayName
  return { id: String(t.id), abbr: t.abbreviation || '?', name: t.shortDisplayName || t.name || t.displayName || '',
    color: t.color ? '#' + t.color : null, score: c.score ?? '', homeAway: c.homeAway,
    lines: (c.linescores || []).map(l => l.displayValue ?? String(l.value ?? '')),
    record: c.records?.[0]?.summary || '',
    // scoreboard only: each team's points/rebounds/assists leader (used on home cards until box data loads)
    leaders: (c.leaders || []).filter(L => ['points', 'rebounds', 'assists'].includes(L.name) && L.leaders?.[0])
      .map(L => ({ cat: L.name, value: L.leaders[0].displayValue, name: L.leaders[0].athlete?.shortName || L.leaders[0].athlete?.displayName || '' })) };
}

// Home team marker ("@ MIA"). spacer=true gives the away team an empty slot of the same width, for alignment.
function homeMark(t, spacer) {
  if (t?.homeAway === 'home') { const m = el('span', 'hm', '@'); m.title = 'Home team'; return m; }
  return spacer ? el('span', 'hm') : document.createTextNode('');
}

function parseEvent(e) {
  const comp = e.competitions?.[0] || {};
  const cs = (comp.competitors || []).map(team);
  const st = e.status?.type || comp.status?.type || {};
  return { id: String(e.id), away: cs.find(c => c.homeAway === 'away') || cs[0], home: cs.find(c => c.homeAway === 'home') || cs[1],
    state: st.state, detail: st.shortDetail || st.detail || '' };
}

// ---------------------------------------------------------------- box score parsing + advanced stats
const COUNT_KEYS = ['min', 'pts', 'fgm', 'fga', 'tpm', 'tpa', 'ftm', 'fta', 'orb', 'drb', 'reb', 'ast', 'stl', 'blk', 'tov', 'pf'];

function parsePlayers(tp) {
  const st = tp.statistics?.[0] || {};
  const labels = (st.labels || st.names || []).map(x => String(x).toUpperCase());
  const keys = st.keys || [];
  const idx = (lab, key) => { let i = labels.indexOf(lab); if (i < 0) i = keys.indexOf(key); return i; };
  const I = {
    min: idx('MIN', 'minutes'), pts: idx('PTS', 'points'),
    fg: idx('FG', 'fieldGoalsMade-fieldGoalsAttempted'), tp: idx('3PT', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted'),
    ft: idx('FT', 'freeThrowsMade-freeThrowsAttempted'), orb: idx('OREB', 'offensiveRebounds'), drb: idx('DREB', 'defensiveRebounds'),
    reb: idx('REB', 'rebounds'), ast: idx('AST', 'assists'), stl: idx('STL', 'steals'), blk: idx('BLK', 'blocks'),
    tov: idx('TO', 'turnovers'), pf: idx('PF', 'fouls'), pm: idx('+/-', 'plusMinus'),
  };
  return (st.athletes || []).map(a => {
    const s = a.stats || [];
    const raw = i => (i < 0 ? '' : String(s[i] ?? ''));
    const num = i => { const v = parseFloat(raw(i)); return Number.isFinite(v) ? v : 0; };
    const pair = i => { const [m, x] = raw(i).split('-').map(Number); return [m || 0, x || 0]; };
    const minRaw = raw(I.min);
    const min = minRaw.includes(':') ? (+minRaw.split(':')[0] || 0) + (+minRaw.split(':')[1] || 0) / 60 : num(I.min);
    const [fgm, fga] = pair(I.fg), [tpm, tpa] = pair(I.tp), [ftm, fta] = pair(I.ft);
    const orb = num(I.orb), drb = num(I.drb);
    const ath = a.athlete || {};
    return {
      id: String(ath.id ?? ''), name: ath.displayName || ath.shortName || '?', short: ath.shortName || ath.displayName || '?',
      pos: ath.position?.abbreviation || '', starter: !!a.starter,
      dnp: !!a.didNotPlay || s.length === 0, reason: a.reason || '',
      min, pts: num(I.pts), fgm, fga, tpm, tpa, ftm, fta, orb, drb,
      reb: I.reb >= 0 ? num(I.reb) : orb + drb, ast: num(I.ast), stl: num(I.stl), blk: num(I.blk),
      tov: num(I.tov), pf: num(I.pf), pm: num(I.pm),
    };
  });
}

const div = (a, b) => (b > 0 ? a / b : null);
const pct = (a, b) => { const d = div(a, b); return d == null ? null : 100 * d; };
function sumRows(ps) { const t = { pm: null }; COUNT_KEYS.forEach(k => (t[k] = 0)); ps.forEach(p => COUNT_KEYS.forEach(k => (t[k] += p[k] || 0))); return t; }
// team-level turnovers (shot clock, 8-second etc.) aren't credited to any player; possessions and TOV% need them
const allTov = T => T.tov + (T.teamTov || 0);
const possOf = (T, O) => T.fga + 0.4 * T.fta - 1.07 * (div(T.orb, T.orb + O.drb) || 0) * (T.fga - T.fgm) + allTov(T);

function shooting(p) {
  return { ts: pct(p.pts, 2 * (p.fga + 0.44 * p.fta)), efg: pct(p.fgm + 0.5 * p.tpm, p.fga),
    tpar: div(p.tpa, p.fga), ftr: div(p.fta, p.fga), tovp: pct(p.tov, p.fga + 0.44 * p.fta + p.tov), ato: div(p.ast, p.tov) };
}

// Basketball-Reference definitions: https://www.basketball-reference.com/about/glossary.html
function playerAdv(p, t, o, five, poss) {
  const a = shooting(p), m = p.min;
  a.gmsc = p.pts + 0.4 * p.fgm - 0.7 * p.fga - 0.4 * (p.fta - p.ftm) + 0.7 * p.orb + 0.3 * p.drb + p.stl + 0.7 * p.ast + 0.7 * p.blk - 0.4 * p.pf - p.tov;
  if (m > 0 && five > 0) {
    a.orbp = pct(p.orb * five, m * (t.orb + o.drb));
    a.drbp = pct(p.drb * five, m * (t.drb + o.orb));
    a.trbp = pct(p.reb * five, m * (t.reb + o.reb));
    a.astp = pct(p.ast, (m / five) * t.fgm - p.fgm);
    a.stlp = pct(p.stl * five, m * poss);
    a.blkp = pct(p.blk * five, m * (o.fga - o.tpa));
    a.usg = pct((p.fga + 0.44 * p.fta + p.tov) * five, m * (t.fga + 0.44 * t.fta + allTov(t)));
  }
  return a;
}
function teamAdv(t, o, poss) {
  const a = shooting({ ...t, tov: allTov(t) });
  a.orbp = pct(t.orb, t.orb + o.drb); a.drbp = pct(t.drb, t.drb + o.orb); a.trbp = pct(t.reb, t.reb + o.reb);
  a.astp = pct(t.ast, t.fgm); a.stlp = pct(t.stl, poss); a.blkp = pct(t.blk, o.fga - o.tpa);
  a.usg = null; a.gmsc = null;
  return a;
}

function buildBox(s) {
  const bp = s.boxscore?.players;
  if (!bp || bp.length < 2) return null;
  const cs = (s.header?.competitions?.[0]?.competitors || []).map(team);
  const teams = bp.slice(0, 2).map(tp => {
    const meta = cs.find(c => c.id === String(tp.team?.id)) || team({ team: tp.team });
    return { ...meta, players: parsePlayers(tp) };
  });
  if (!teams.some(T => T.players.some(p => !p.dnp))) return null;
  const [A, B] = teams;
  for (const T of teams) {
    T.tot = sumRows(T.players);
    const ts = (s.boxscore.teams || []).find(x => String(x.team?.id) === T.id)?.statistics || [];
    const stat = n => parseFloat(ts.find(x => x.name === n)?.displayValue);
    const total = stat('totalTurnovers'), teamOnly = stat('teamTurnovers');
    T.tot.teamTov = Number.isFinite(teamOnly) ? teamOnly : Number.isFinite(total) ? Math.max(0, total - T.tot.tov) : 0;
  }
  const poss = 0.5 * (possOf(A.tot, B.tot) + possOf(B.tot, A.tot));
  // player MIN is rounded to whole minutes, so sums drift (e.g. 241). Finals have a known length: 48 + 5 per OT.
  const comp = s.header?.competitions?.[0] || {};
  const periods = Math.max(0, ...(comp.competitors || []).map(c => c.linescores?.length || 0));
  const exact = comp.status?.type?.state === 'post' && periods >= 4 ? 48 + 5 * (periods - 4) : null;
  const mp = exact ? 5 * exact : Math.max(A.tot.min, B.tot.min);
  const pace = mp > 0 ? (48 * poss) / (mp / 5) : null;
  for (const [T, O] of [[A, B], [B, A]]) {
    const five = (exact || (T.tot.min || mp) / 5);
    T.gameMin = five * 5;
    T.players.forEach(p => (p.a = playerAdv(p, T.tot, O.tot, five, poss)));
    T.tot.a = teamAdv(T.tot, O.tot, poss);
    T.ortg = pct(T.tot.pts, poss); T.drtg = pct(O.tot.pts, poss); T.pace = pace; T.poss = poss;
  }
  return { teams };
}

// ---------------------------------------------------------------- scoreboard
async function loadScoreboard() {
  stop('sb');
  let delay = 0;
  try {
    const d = await getJSON(API + '/scoreboard' + (state.date ? '?dates=' + state.date : ''), 'scoreboard');
    // Responses for a requested date carry no `day`, and game start times are UTC (evening games fall on the
    // next UTC day), so the requested date is the only reliable label. `day` is present for "today".
    state.dayDate = state.date ? state.date.replace(/(\d{4})(\d\d)(\d\d)/, '$1-$2-$3')
      : d.day?.date || d.events?.[0]?.date?.slice(0, 10) || null;
    state.sbError = false;
    state.games = (d.events || []).map(parseEvent);
    // the watched game is refreshed more often than the scoreboard: keep our fresher score/clock on its tile
    const sel = state.view === 'game' && state.detail && state.games.find(g => g.id === state.gameId);
    if (sel && state.away && state.home) {
      Object.assign(sel, { state: state.gameState, detail: state.detail });
      sel.away.score = state.away.score; sel.home.score = state.home.score;
    }
    renderDay(); renderGames();
    renderListing();
    if (state.games.some(g => g.state === 'in')) delay = sec('others');
    else if (state.games.some(g => g.state === 'pre')) delay = MS.preSb;
  } catch (e) {
    state.sbError = true;
    setStatus(viewStatus(), 'Couldn’t load scoreboard (' + e.message + '). Retrying…', true);
    delay = MS.err;
  }
  if (delay && !document.hidden) sched('sb', loadScoreboard, delay);
}

function renderDay() {
  let label = 'Today';
  if (state.date && state.dayDate) label = new Date(state.dayDate + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  $('#day').textContent = label;
  $('#today').hidden = !state.date;
}

function renderGames() {
  const box = $('#games');
  box.replaceChildren();
  if (!state.games.length) box.append(el('span', 'muted', 'No games'));
  for (const g of orderedGames()) {
    const b = el('button', 'g' + (g.state === 'in' ? ' live' : ''));
    b.setAttribute('role', 'listitem');
    b.setAttribute('aria-current', String(state.view === 'game' && g.id === state.gameId));
    for (const t of [g.away, g.home]) {
      const row = el('div', 't');
      const nm = el('span');
      nm.append(homeMark(t, true), t?.abbr || '');
      row.append(nm, el('span', null, g.state !== 'pre' ? t?.score : ''));
      b.append(row);
    }
    b.append(el('div', 's', g.detail));
    b.onclick = () => openGame(g.id);
    box.append(b);
  }
  measureHeader();
}

// ---------------------------------------------------------------- game view
// "Listing" pages show every game: home, Top performers, and the Games view before a game is opened.
// They share the per-game box data loop (loadLeaders).
const listing = () => state.view === 'home' || state.view === 'leaders' || (state.view === 'game' && !state.gameId);
function renderListing() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'leaders') renderLeaders();
  else if (!state.gameId) renderGameList();
}
function renderGameList() {
  $('#gameList').replaceChildren(...(state.games.length ? orderedGames().map(gameCard) : [el('p', 'muted', 'No games on this day.')]));
}
// game view shows either the card grid or one game; the header strip only appears inside a game
function syncMode() {
  $('#gameView').dataset.mode = state.gameId ? 'game' : 'list';
  $('#games').hidden = state.view === 'home' || state.view === 'season' || (state.view === 'game' && !state.gameId);
  ['#prev', '#day', '#next'].forEach(x => ($(x).hidden = state.view === 'season'));   // season stats have no date
  if (state.view === 'season') $('#today').hidden = true; else renderDay();

}
// user navigation to a game: a new history entry, so the browser Back button returns to where they were
function openGame(id) {
  if (state.view === 'game' && id === state.gameId) return;
  pushNav();
  if (state.view !== 'game') setView('game', false);
  if (id === state.gameId) loadPBP(); else selectGame(id);
}

function selectGame(id) {
  if (id === state.gameId && (state.plays.length || state.box)) { renderGames(); return; }
  stop('pbp'); stop('ld'); resetLive();
  Object.assign(state, { gameId: id, plays: [], box: null, filter: 'all', period: 'all' });
  syncMode();
  periodCount = 0; filterKey = '';
  $('#period').replaceChildren(new Option('All', 'all'));
  $('#list').replaceChildren(); sections = new Map();
  $('#box').replaceChildren(); $('#topSel').replaceChildren();
  writeHash(); renderGames();
  const g = state.games.find(x => x.id === id);
  if (g) { state.away = g.away; state.home = g.home; state.gameState = g.state; renderScore(g.detail); }
  if (state.view === 'game') { setStatus('#status', 'Loading…'); loadPBP(); }
}

function clearGame(msg) {
  stop('pbp'); resetLive();
  Object.assign(state, { gameId: null, plays: [], box: null });
  $('#score').hidden = true; $('#controls').hidden = true;
  $('#list').replaceChildren(); sections = new Map();
  $('#box').replaceChildren(); $('#topSel').replaceChildren();
  $('#empty').hidden = true;
  setStatus('#status', msg || '');
  syncMode();
  writeHash();
}

// Live game loop. The first load and each box-score refresh fetch the full summary (~34 KB). In between, the
// "lightweight" path fetches the game status (~0.3 KB) plus only the page of plays past what we already have
// (~2 KB). The box is refreshed every settings.box seconds, and only if new plays arrived since the last one.
async function loadPBP() {
  stop('pbp');
  const id = state.gameId;
  if (!id || state.view !== 'game') return;
  let delay = 0, lite = false;
  try {
    lite = settings.lite && live.liteFails < 2 && state.gameState === 'in' && live.lastBox > 0 &&
      !(live.dirty && Date.now() - live.lastBox >= sec('box'));
    if (lite) await tickLite(id); else await tickFull(id);
    if (id !== state.gameId) return;
    live.liteFails = 0;
    const sig = (state.plays.at(-1)?.id || '') + '|' + state.clock + '|' + state.statusName;
    live.idle = sig === live.sig ? live.idle + 1 : 0;
    live.sig = sig;
    delay = nextDelay();
    setStatus('#status', state.gameState === 'in' ? liveStatus(delay)
      : state.gameState === 'pre' ? 'Game hasn’t started yet.' : 'Final.');
  } catch (e) {
    if (id !== state.gameId) return;
    if (lite) { live.liteFails++; delay = sec('live'); }   // after 2 failures in a row, fall back to full summaries
    else { setStatus('#status', 'Couldn’t load game (' + e.message + '). Retrying…', true); delay = MS.err; }
  }
  if (delay && !document.hidden && state.view === 'game') sched('pbp', loadPBP, delay);
}

function applyStatus(st) {
  const t = st?.type || {};
  state.gameState = t.state || state.gameState;
  state.statusName = t.name || '';
  state.clock = st?.displayClock ?? '';
  state.detail = t.shortDetail || t.detail || '';
}

async function tickFull(id) {
  const s = await getJSON(summaryUrl(id), 'summary');
  if (id !== state.gameId) return;
  const comp = s.header?.competitions?.[0] || {};
  const cs = (comp.competitors || []).map(team);
  state.away = cs.find(c => c.homeAway === 'away') || state.away;
  state.home = cs.find(c => c.homeAway === 'home') || state.home;
  applyStatus(comp.status);
  renderScore(state.detail);
  renderFilters();
  updatePlays((s.plays || []).map(norm));
  state.box = buildBox(s);
  renderBox();
  if (state.box) ingestLeaders(id, state.box, state.gameState === 'post');   // free refresh for the leaders page
  live.lastBox = Date.now(); live.dirty = false;
  $('#boxAge').textContent = state.gameState === 'in' && state.box ? 'updated ' + new Date().toLocaleTimeString() : '';
  syncStrip(state.detail);
}

async function tickLite(id) {
  const page = Math.floor(state.plays.length / PAGE) + 1;   // the page holding the first play we don't have yet
  const [st, pg] = await Promise.all([getJSON(coreUrl(id, 'status'), 'status'),
    getJSON(coreUrl(id, 'plays?limit=' + PAGE + '&page=' + page), 'plays')]);
  if (id !== state.gameId) return;
  // more than a page behind (e.g. back from a hidden tab), or the game just ended: one full refresh instead
  if ((pg.pageCount || 0) > page || st?.type?.state === 'post') return tickFull(id);
  const plays = state.plays.slice(), at = new Map(plays.map((p, i) => [p.id, i]));
  for (const raw of pg.items || []) {
    const p = normCore(raw), i = at.get(p.id);
    if (i == null) { at.set(p.id, plays.length); plays.push(p); } else plays[i] = p;   // new play, or a correction
  }
  if (plays.length > state.plays.length) live.dirty = true;
  applyStatus(st);
  const last = plays.at(-1);
  if (last?.away != null && state.away && state.home) { state.away.score = String(last.away); state.home.score = String(last.home); }
  renderScore(state.detail);
  updatePlays(plays);
  if (state.box) $('#box').querySelectorAll('.th').forEach(h => {      // keep the box headers' scores current
    const t = teamById(h.dataset.team); if (t) h.querySelector('.pts').textContent = t.score;
  });
  syncStrip(state.detail);
}

// How long to wait before the next live poll. During breaks nothing changes, so check less often.
function nextDelay() {
  live.mode = 'live';
  if (state.gameState === 'pre') return MS.prePbp;
  if (state.gameState !== 'in') return 0;
  const base = sec('live');
  if (!settings.breaks) return base;
  if (state.statusName === 'STATUS_HALFTIME' || /^half/i.test(state.detail)) { live.mode = 'Halftime'; return Math.max(base, 60000); }
  if (state.statusName === 'STATUS_END_PERIOD' || /^end of/i.test(state.detail)) { live.mode = 'Between quarters'; return Math.max(base, 30000); }
  if (live.idle > 0 && /timeout/i.test(state.plays.at(-1)?.type || '')) { live.mode = 'Timeout'; return Math.max(base, 30000); }
  // nothing changed since the last poll (review, injury, foul shots being set up…): back off gradually, up to 30s
  if (live.idle > 0) { live.mode = 'Play stopped'; return Math.max(base, Math.min(30000, base * (1 + live.idle))); }
  return base;
}
const liveStatus = delay => 'Live · updated ' + new Date().toLocaleTimeString() + ' · ' +
  (live.mode === 'live' ? 'refreshing every ' + delay / 1000 + 's' : live.mode + ', checking every ' + delay / 1000 + 's');

function syncStrip(detail) {
  const g = state.games.find(x => x.id === state.gameId);
  if (!g) return;
  g.state = state.gameState; g.detail = detail || g.detail;
  if (state.away && g.away) g.away.score = state.away.score;
  if (state.home && g.home) g.home.score = state.home.score;
  renderGames();
}

function renderScore(detail) {
  const box = $('#score');
  const { away, home, gameState } = state;
  if (!away || !home) { box.hidden = true; return; }
  const side = (t, rev) => {
    const d = el('div', 'tm');
    const ab = el('span', 'ab', t.abbr);
    if (t.color) ab.style.setProperty('--c', t.color);
    const who = el('span');
    who.append(homeMark(t), ab);
    const parts = [who, el('span', 'nm', t.name), el('span', 'pts', gameState === 'pre' ? '–' : t.score)];
    d.append(...(rev ? parts.reverse() : parts));
    return d;
  };
  const mid = el('div', 'mid' + (gameState === 'in' ? ' live' : ''), (gameState === 'in' ? '● ' : '') + detail);
  box.replaceChildren(side(away, false), mid, side(home, true));
  box.hidden = false;
}

// ---------------------------------------------------------------- plays
const norm = p => ({
  id: String(p.id ?? p.sequenceNumber), text: p.text || p.type?.text || '', type: p.type?.text || '',
  period: p.period?.number || 0, clock: p.clock?.displayValue || '',
  teamId: p.team?.id != null ? String(p.team.id) : null,
  scoring: !!p.scoringPlay, value: p.scoreValue || 0, away: p.awayScore, home: p.homeScore,
});
// core-API plays link the team as a $ref URL (…/teams/14?…) instead of an object with an id
const normCore = p => ({ ...norm(p), teamId: refId(p.team?.$ref, 'teams') });

function updatePlays(plays) {
  const prev = state.plays;
  // append-only if the tail we already rendered is unchanged; otherwise (corrections, deletions) redraw
  const k = Math.max(0, prev.length - 3);
  const appendOnly = prev.length > 0 && plays.length >= prev.length &&
    prev.slice(k).every((p, i) => plays[k + i].id === p.id && plays[k + i].text === p.text);
  state.plays = plays;
  updatePeriods();
  if (appendOnly) plays.slice(prev.length).forEach(p => insertPlay(p, true));
  else renderPlays(prev.length ? new Map(prev.map(p => [p.id, p.text])) : null);   // highlight new + corrected plays
  $('#controls').hidden = plays.length === 0;
  $('#empty').hidden = $('#list').children.length > 0;
}

const periodName = n => (n <= 4 ? 'Q' + n : n === 5 ? 'OT' : n - 4 + 'OT');
const periodTitle = n => (n <= 4 ? ['1st', '2nd', '3rd', '4th'][n - 1] + ' Quarter' : n === 5 ? 'Overtime' : n - 4 + ' Overtime');

function passes(p) {
  if (state.period !== 'all' && String(p.period) !== state.period) return false;
  if (state.filter === 'scoring') return p.scoring;
  if (state.filter !== 'all') return p.teamId === state.filter;
  return true;
}
const teamById = id => [state.away, state.home].find(t => t && t.id === id);

function playEl(p) {
  const li = el('li', 'p' + (p.scoring ? ' scoring' : ''));
  const t = teamById(p.teamId);
  const tm = el('span', 'tm', t ? t.abbr : '');
  if (t?.color) tm.style.setProperty('--c', t.color);
  const tx = el('span', 'tx', p.text);

function insertPlay(p, isNew) {

// Box score sort, shared by both team tables. Default: starters first, then Game Score.
const sortVal = (c, r) => {                       // numeric sort value, or null (always sorted last)
  const v = c.s ? c.s(r) : c.v(r);
  const n = typeof v === 'number' ? v : parseFloat(v);
  return Number.isFinite(n) ? n : null;
};
const lastName = p => p.name.split(' ').slice(1).join(' ') || p.name;
function sortPlayers(ps) {
  const { key, dir } = state.sort;
  const col = COLS.find(c => c.h === key);
  const gmsc = p => p.a?.gmsc ?? -Infinity;
  return ps.slice().sort((a, b) => {
    if (!col) return dir * lastName(a).localeCompare(lastName(b));
    const x = sortVal(col, a), y = sortVal(col, b);
    if (x !== y) {
      if (x == null) return 1;
      if (y == null) return -1;
      return dir * (x - y);
    }
    return gmsc(b) - gmsc(a);                       // ties: higher Game Score first
  });
}
function setSort(key) {
  state.sort = state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: key === 'Player' ? 1 : -1 };
  renderBox();
  const th = [...$('#box').querySelectorAll('.bx thead th')].find(t => t.dataset.k === key);   // keep keyboard focus
  if (th) th.focus();
}
function sortHeader(label, key, cls, title) {
  const th = el('th', cls, label);
  th.dataset.k = key; th.tabIndex = 0;
  th.title = (title ? title + ' · ' : '') + 'click to sort';
  if (state.sort.key === key) th.setAttribute('aria-sort', state.sort.dir > 0 ? 'ascending' : 'descending');
  th.onclick = () => setSort(key);
  th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSort(key); } };
  return th;
}

    tr.append(td);

  const tfoot = el('tfoot'), fr = el('tr');
  fr.append(el('td', null, 'Team'));

  tfoot.append(fr);
  tbl.append(cg, thead, tbody, tfoot);
  wrap.append(tbl);

  const out = [head, wrap];
  const dnps = T.players.filter(p => p.dnp);
  if (dnps.length) {

      p.append(a, document.createTextNode((d.reason ? ' (' + d.reason.toLowerCase() + ')' : '') + (i < dnps.length - 1 ? ' · ' : '')));
    });
    out.push(p);
  }
  return out;
}

function ingestLeaders(gameId, box, final) {
  const [A, B] = box.teams;
  const rows = [];
  for (const [T, O] of [[A, B], [B, A]]) {
    for (const p of T.players) {
      if (p.dnp || !(p.min > 0)) continue;
      rows.push({ g: gameId, tm: T.abbr, op: O.abbr, home: T.homeAway === 'home', name: p.name, short: p.short, min: p.min,
        pts: p.pts, reb: p.reb, ast: p.ast, stl: p.stl, blk: p.blk, tov: p.tov, orb: p.orb, pm: p.pm,
        fgm: p.fgm, fga: p.fga, tpm: p.tpm, tpa: p.tpa, ftm: p.ftm, fta: p.fta,
        gmsc: p.a.gmsc, ts: p.a.ts });
    }
  }
  const entry = { final, rows, at: Date.now() };
  leaders.set(gameId, entry);
  if (final) store.set('nbapbp.box.' + gameId, entry);   // finals never change: never refetch them
}

async function pool(items, n, fn) {
  const q = [...items];
  await Promise.all(Array.from({ length: Math.min(n, q.length) }, async () => { while (q.length) await fn(q.shift()); }));
}

// Per-game box data for every started game; feeds both the home page and the Top performers view.
async function loadLeaders() {
  stop('ld');
  if (!listing()) return;
  const date = state.date;
  const started = state.games.filter(g => g.state !== 'pre');
  const todo = started.filter(g => {
    if (!leaders.has(g.id)) { const c = store.get('nbapbp.box.' + g.id); if (c) leaders.set(g.id, c); }
    const c = leaders.get(g.id);
    return !(c && (c.final || Date.now() - (c.at || 0) < sec('leaders') / 2));   // skip finals and just-fetched games
  });
  renderListing();                                   // cached finals + scoreboard data, before the fetches finish
  if (todo.length) setStatus(viewStatus(), 'Loading ' + todo.length + ' game' + (todo.length > 1 ? 's' : '') + '…');
  let failed = 0;
  await pool(todo, LEADER_CONCURRENCY, async g => {
    try {
      const s = await getJSON(summaryUrl(g.id), 'summary');
      const box = buildBox(s);
      const st = s.header?.competitions?.[0]?.status?.type?.state;
      if (box) ingestLeaders(g.id, box, st === 'post');
    } catch { failed++; }
  });
  if (!listing() || date !== state.date) return;
  renderListing();
  if (state.sbError) return;                         // keep the scoreboard error visible
  const anyLive = state.games.some(g => g.state === 'in'), pre = state.games.some(g => g.state === 'pre');
  const msg = !state.games.length ? 'No games on this day.'
    : !started.length ? 'No games have started yet.'
    : started.length + ' of ' + state.games.length + ' games · updated ' + new Date().toLocaleTimeString() + (anyLive ? ' · live games refresh every ' + fmtSec(settings.leaders) : '');
  setStatus(viewStatus(), failed ? msg + ' · ' + failed + ' failed to load' : msg, !!failed);
  if ((anyLive || pre || failed) && !document.hidden) sched('ld', loadLeaders, anyLive || failed ? sec('leaders') : MS.preSb);
}

const dayRows = () => {
  const ids = new Set(state.games.map(g => g.id));
  return [...leaders].filter(([id]) => ids.has(id)).flatMap(([, e]) => e.rows);
};

// One category card: top n (ties at the cut included, up to n + 3 rows).
function leaderCard(c, rows, n, liveIds) {
  const vals = rows.map(r => ({ r, v: c.v(r) })).filter(x => x.v != null && Number.isFinite(x.v)).sort((a, b) => b.v - a.v);
  if (!vals.length) return null;
  const cut = vals[Math.min(n - 1, vals.length - 1)].v;
  const list = vals.filter((x, i) => i < n || x.v === cut).slice(0, n + 3);
  const card = el('div', 'card');
  card.append(el('h3', null, c.h));
  const ol = el('ol');
  ol.style.cssText = 'list-style:none;margin:0;padding:0';
  let rank = 0, last = null;
  list.forEach((x, i) => {
    if (x.v !== last) { rank = i + 1; last = x.v; }
    const r = x.r, li = el('li', 'go' + (followed(r.tm) ? ' fol' : ''));
    const matchup = r.tm + (r.home === false ? ' @ ' : ' vs ') + r.op;
    // the whole row opens the game; the player's name keeps its Basketball Reference link
    li.tabIndex = 0;
    li.title = 'Open ' + matchup;
    li.onclick = e => { if (!e.target.closest('a')) openGame(r.g); };
    li.onkeydown = e => { if (e.key === 'Enter' && e.target === li) openGame(r.g); };
    const who = el('span');
    const a = el('a', null, r.name);
    a.href = bbref(r.name); a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = r.name + ' on Basketball Reference';
    const sub = el('span', 'sub');
    sub.append(el('span', 'mu', matchup), document.createTextNode(' · ' + r.pts + 'p ' + r.reb + 'r ' + r.ast + 'a · ' + r.fgm + '-' + r.fga + ' FG'));
    if (liveIds.has(r.g)) sub.append(el('span', 'dot', ' ● live'));
    who.append(a, sub);
    li.append(el('span', 'rk', String(rank)), who, el('span', 'val', c.f ? c.f(x.v) : String(x.v)), el('span', 'chev', '›'));
    ol.append(li);
  });
  card.append(ol);
  return card;
}

function gameCard(g) {

  for (const t of teams) {
    const tr = el('tr'), name = el('td');
    const ab = el('span', 'ab');
    ab.append(homeMark(t, true), t.abbr);
    if (t.color) ab.style.setProperty('--c', t.color);
    name.append(ab);
    if (t.record) name.append(el('span', 'rec', t.record));
    tr.append(name);
    for (let i = 0; i < n; i++) tr.append(el('td', null, t.lines[i] ?? ''));
    if (started) tr.append(el('td', 't', String(t.score)));
    tb.append(tr);
  }
  tbl.append(tb);
  card.append(tbl);

  // top 3 players per team by Game Score once box data is in; until then the scoreboard's team leaders
  const entry = leaders.get(g.id);
  const pl = el('div', 'pl');
  for (const t of teams) {
    const top = (entry?.rows || []).filter(r => r.tm === t.abbr).sort((a, b) => (b.gmsc ?? -99) - (a.gmsc ?? -99)).slice(0, 3);
    const who = el('div', 'who');
    if (top.length) top.forEach(r => who.append(el('span', 'pp', r.short + ' ' + r.pts + 'p ' + r.reb + 'r ' + r.ast + 'a')));
    else if (started) t.leaders.forEach(L => who.append(el('span', 'pp', ({ points: 'PTS', rebounds: 'REB', assists: 'AST' })[L.cat] + ' ' + L.name + ' ' + L.value)));
    if (!who.childNodes.length) continue;
    pl.append(el('span', 'ab', t.abbr), who);
  }
  if (pl.childNodes.length) card.append(pl);
  return card;
}

// ---------------------------------------------------------------- season: per-game leaders and best games
// Data files are built nightly by scripts/build-season.mjs (GitHub Action) and served next to this page.
// The metric definitions below must match PMETRICS/TMETRICS in that script (a test compares them).
const SEASON_P = {
  gmsc: { best: -1, v: r => r.pts + 0.4 * r.fgm - 0.7 * r.fga - 0.4 * (r.fta - r.ftm) + 0.7 * r.orb + 0.3 * r.drb + r.stl + 0.7 * r.ast + 0.7 * r.blk - 0.4 * r.pf - r.tov },
  min: { best: -1, v: r => r.min }, pts: { best: -1, v: r => r.pts }, reb: { best: -1, v: r => r.orb + r.drb },
  ast: { best: -1, v: r => r.ast }, stl: { best: -1, v: r => r.stl }, blk: { best: -1, v: r => r.blk },
  tov: { best: -1, v: r => r.tov }, fgm: { best: -1, v: r => r.fgm + r.fga / 1000 }, tpm: { best: -1, v: r => r.tpm + r.tpa / 1000 },
  ftm: { best: -1, v: r => r.ftm + r.fta / 1000 }, pm: { best: -1, v: r => r.pm },
  ts: { best: -1, v: r => (r.fga + 0.44 * r.fta >= 10 ? (100 * r.pts) / (2 * (r.fga + 0.44 * r.fta)) : null) },
};
const sPoss = r => r.fga + 0.4 * r.fta - 1.07 * (div(r.orb, r.orb + r.odrb) || 0) * (r.fga - r.fgm) + r.tov;
const sOposs = r => r.ofga + 0.4 * r.ofta - 1.07 * (div(r.oorb, r.oorb + r.drb) || 0) * (r.ofga - r.ofgm) + r.otov;
const sGamePoss = r => 0.5 * (sPoss(r) + sOposs(r));
const SEASON_T = {
  pts: { best: -1, v: r => r.pts }, opp: { best: 1, v: r => r.opp }, mar: { best: -1, v: r => r.pts - r.opp },
  ortg: { best: -1, v: r => (100 * r.pts) / sGamePoss(r) }, drtg: { best: 1, v: r => (100 * r.opp) / sGamePoss(r) },
  pace: { best: -1, v: r => (48 * sGamePoss(r)) / (r.min / 5) },
  fgp: { best: -1, v: r => (100 * r.fgm) / r.fga }, tpm: { best: -1, v: r => r.tpm }, tpp: { best: -1, v: r => (r.tpa >= 15 ? (100 * r.tpm) / r.tpa : null) },
  ast: { best: -1, v: r => r.ast }, reb: { best: -1, v: r => r.orb + r.drb }, tov: { best: 1, v: r => r.tov },
  stl: { best: -1, v: r => r.stl }, blk: { best: -1, v: r => r.blk },
};
// per-game averages from season totals (all sortable both ways: the players file has everyone)
const avgOf = k => r => div(r[k], r.gp);
const SEASON_A = {
  gp: { best: -1, v: r => r.gp }, min: { best: -1, v: avgOf('min') }, pts: { best: -1, v: avgOf('pts') },
  reb: { best: -1, v: r => div(r.orb + r.drb, r.gp) }, ast: { best: -1, v: avgOf('ast') }, stl: { best: -1, v: avgOf('stl') },
  blk: { best: -1, v: avgOf('blk') }, tov: { best: -1, v: avgOf('tov') }, fgp: { best: -1, v: r => (r.fga ? (100 * r.fgm) / r.fga : null) },
  tpm: { best: -1, v: avgOf('tpm') }, tpp: { best: -1, v: r => (r.tpa ? (100 * r.tpm) / r.tpa : null) },
  ftp: { best: -1, v: r => (r.fta ? (100 * r.ftm) / r.fta : null) },
  ts: { best: -1, v: r => (r.fga + r.fta ? (100 * r.pts) / (2 * (r.fga + 0.44 * r.fta)) : null) },
  gmsc: { best: -1, v: avgOf('gmsc') }, pm: { best: -1, v: avgOf('pm') },
};
const SEASON_TOP = 50;
const SEASON_TABS = {
  avg: { file: 'season-players.json', metrics: SEASON_A, sort: 'pts', both: true },
  pg: { file: 'season-best.json', metrics: SEASON_P, sort: 'gmsc' },
  tg: { file: 'season-best.json', metrics: SEASON_T, sort: 'mar' },
};
const seasonData = {};          // file name -> parsed JSON
const seasonState = { tab: 'avg', team: '', find: '', all: false, sort: { avg: { k: 'pts', dir: -1 }, pg: { k: 'gmsc', dir: -1 }, tg: { k: 'mar', dir: -1 } } };
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const rowObj = (cols, r) => Object.fromEntries(cols.map((c, i) => [c, r[i]]));

async function seasonFile(name) {
  if (!seasonData[name]) seasonData[name] = await getJSON('data/' + name, null, 'no-cache');   // GitHub Pages sends ETags
  return seasonData[name];
}

// Best games: the small file holds the exact top 50 for every column; filtering needs every row.
const seasonFiltered = () => !!(seasonState.team || seasonState.find.trim());
async function loadSeason() {
  if (state.view !== 'season') return;
  const tab = SEASON_TABS[seasonState.tab];
  const name = seasonState.tab !== 'avg' && seasonFiltered() ? 'season-games.json' : tab.file;
  if (!seasonData[name]) setStatus('#seasonStatus', 'Loading…');
  try {
    const d = await seasonFile(name);
    if (state.view !== 'season') return;
    renderSeason(d);
  } catch (e) {
    setStatus('#seasonStatus', 'Season data isn’t available yet (' + e.message + ').', true);
    $('#seasonTable').replaceChildren();
  }
}

function teamMatch(abbr) {
  const t = seasonState.team;
  return !t || (t === '*' ? followed(abbr) : abbr === t);
}

function renderSeason(d) {
  const tab = seasonState.tab, def = SEASON_TABS[tab], sort = seasonState.sort[tab], m = def.metrics[sort.k];
  const find = seasonState.find.trim().toLowerCase();
  let rows;
  if (tab === 'avg') {
    rows = d.rows.map(r => { const o = rowObj(d.cols, r); o.tm = d.teams[o.t]; o.name = d.players[o.p][1]; o.pid = d.players[o.p][0]; return o; })
      .filter(o => teamMatch(o.tm) && (!find || o.name.toLowerCase().includes(find)));
    // qualified: played in at least 70% of their team's games (NBA leaderboards use a similar rule)
    if (!seasonState.all && !find) rows = rows.filter(o => o.gp >= 0.7 * d.teamGames[o.t]);
  } else if (tab === 'pg') {
    rows = d.rows.map(r => { const o = rowObj(d.pcols, r), g = d.games[o.g];
      return { ...o, tm: d.teams[o.t], op: d.teams[o.o], name: d.players[o.p][1], gid: g[0], day: g[1] }; })
      .filter(o => teamMatch(o.tm) && (!find || o.name.toLowerCase().includes(find)));
  } else {
    rows = d.trows.map(r => { const o = rowObj(d.tcols, r), g = d.games[o.g];
      return { ...o, tm: d.teams[o.t], op: d.teams[o.o], gid: g[0], day: g[1] }; }).filter(o => teamMatch(o.tm));
  }
  const vals = rows.map(o => ({ o, v: m.v(o) }));
  vals.sort((a, b) => (a.v == null) - (b.v == null) || sort.dir * (a.v - b.v));
  const shown = tab === 'avg' ? vals : vals.slice(0, SEASON_TOP);
  $('#seasonTable').replaceChildren(seasonTable(tab, shown));
  const what = tab === 'avg' ? rows.length + ' players' + (!seasonState.all && !find ? ' (qualified)' : '')
    : 'top ' + Math.min(SEASON_TOP, rows.length) + ' of ' + (seasonFiltered() ? rows.length : 'all') + ' ' + (tab === 'pg' ? 'player' : 'team') + ' games';
  setStatus('#seasonStatus', d.through ? 'Regular season through ' + fmtDay(d.through) + ' · ' + what : what);
}

// columns: [header, metric key | null, cell(o) -> text, tooltip, class]
const f1n = v => (v == null || !Number.isFinite(v) ? '' : v.toFixed(1));
const SEASON_COLS = {
  avg: [['GP', 'gp', o => o.gp, 'Games played'], ['MIN', 'min', o => f1n(div(o.min, o.gp)), 'Minutes per game'],
    ['PTS', 'pts', o => f1n(div(o.pts, o.gp)), 'Points per game', 'k'], ['REB', 'reb', o => f1n(div(o.orb + o.drb, o.gp)), 'Rebounds per game'],
    ['AST', 'ast', o => f1n(div(o.ast, o.gp)), 'Assists per game'], ['STL', 'stl', o => f1n(div(o.stl, o.gp)), 'Steals per game'],
    ['BLK', 'blk', o => f1n(div(o.blk, o.gp)), 'Blocks per game'], ['TO', 'tov', o => f1n(div(o.tov, o.gp)), 'Turnovers per game'],
    ['FG%', 'fgp', o => f1n(SEASON_A.fgp.v(o)), 'Field goal %'], ['3PM', 'tpm', o => f1n(div(o.tpm, o.gp)), '3-pointers made per game'],
    ['3P%', 'tpp', o => f1n(SEASON_A.tpp.v(o)), '3-point %'], ['FT%', 'ftp', o => f1n(SEASON_A.ftp.v(o)), 'Free throw %'],
    ['TS%', 'ts', o => f1n(SEASON_A.ts.v(o)), 'True shooting %'], ['GmSc', 'gmsc', o => f1n(div(o.gmsc, o.gp)), 'Average Game Score'],
    ['+/-', 'pm', o => f1n(div(o.pm, o.gp)), 'Plus/minus per game']],
  pg: [['Game', null, o => o.tm + (o.home ? ' vs ' : ' @ ') + o.op, 'Team and opponent', 'l'], ['Date', null, o => fmtDay(o.day), null, 'l'],
    ['GmSc', 'gmsc', o => f1n(SEASON_P.gmsc.v(o)), 'Game Score', 'k'], ['MIN', 'min', o => o.min, 'Minutes'], ['PTS', 'pts', o => o.pts, 'Points'],
    ['REB', 'reb', o => o.orb + o.drb, 'Rebounds'], ['AST', 'ast', o => o.ast, 'Assists'], ['STL', 'stl', o => o.stl, 'Steals'],
    ['BLK', 'blk', o => o.blk, 'Blocks'], ['TO', 'tov', o => o.tov, 'Turnovers'], ['FG', 'fgm', o => o.fgm + '-' + o.fga, 'Field goals'],
    ['3P', 'tpm', o => o.tpm + '-' + o.tpa, '3-pointers'], ['FT', 'ftm', o => o.ftm + '-' + o.fta, 'Free throws'],
    ['TS%', 'ts', o => f1n(SEASON_P.ts.v(o)), 'True shooting % (10+ shot attempts to rank)'], ['+/-', 'pm', o => sg(o.pm), 'Plus/minus']],
  tg: [['Opp', null, o => (o.home ? 'vs ' : '@ ') + o.op, 'Opponent', 'l'], ['Date', null, o => fmtDay(o.day), null, 'l'],
    ['Result', null, o => (o.pts > o.opp ? 'W ' : 'L ') + o.pts + '–' + o.opp, null, 'l'],
    ['+/-', 'mar', o => sg(o.pts - o.opp), 'Point margin', 'k'], ['PTS', 'pts', o => o.pts, 'Points scored'], ['OPP', 'opp', o => o.opp, 'Points allowed'],
    ['ORtg', 'ortg', o => f1n(SEASON_T.ortg.v(o)), 'Points per 100 possessions'], ['DRtg', 'drtg', o => f1n(SEASON_T.drtg.v(o)), 'Points allowed per 100 possessions'],
    ['Pace', 'pace', o => f1n(SEASON_T.pace.v(o)), 'Possessions per 48 minutes'], ['FG%', 'fgp', o => f1n(SEASON_T.fgp.v(o)), 'Field goal %'],
    ['3PM', 'tpm', o => o.tpm, '3-pointers made'], ['3P%', 'tpp', o => f1n((100 * o.tpm) / o.tpa), '3-point % (15+ attempts to rank)'],
    ['AST', 'ast', o => o.ast, 'Assists'], ['REB', 'reb', o => o.orb + o.drb, 'Rebounds'], ['TO', 'tov', o => o.tov, 'Turnovers'],
    ['STL', 'stl', o => o.stl, 'Steals'], ['BLK', 'blk', o => o.blk, 'Blocks']],
};

function seasonTable(tab, vals) {
  const def = SEASON_TABS[tab], sort = seasonState.sort[tab];
  const wrap = el('div', 'stw'), tbl = el('table', 'st'), hr = el('tr');
  hr.append(el('th', null, tab === 'tg' ? 'Team' : 'Player'));
  for (const [h, k, , title, cls] of SEASON_COLS[tab]) {
    const th = el('th', cls || null, h);
    if (title) th.title = title;
    if (k) {
      th.tabIndex = 0; th.dataset.k = k;
      if (sort.k === k) th.setAttribute('aria-sort', sort.dir > 0 ? 'ascending' : 'descending');
      const go = () => {
        const best = def.metrics[k].best;
        // best games are pre-selected per column, so only the "best" direction is exact; per-game sorts both ways
        seasonState.sort[tab] = sort.k === k && def.both ? { k, dir: -sort.dir } : { k, dir: best };
        loadSeason();
      };
      th.onclick = go;
      th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    }
    hr.append(th);
  }
  const thead = el('thead'); thead.append(hr);
  const tb = el('tbody');
  let rank = 0, last;
  vals.forEach(({ o, v }, i) => {
    if (v !== last) { rank = i + 1; last = v; }
    const tr = el('tr', [tab !== 'avg' && 'go', followed(o.tm) && 'fol'].filter(Boolean).join(' ') || null);
    const first = el('td');
    first.append(el('span', 'rk', String(rank)));
    if (tab === 'tg') first.append(o.tm);
    else {
      const a = el('a', null, o.name);
      a.href = bbref(o.name); a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = o.name + ' on Basketball Reference';
      first.append(a);
      if (tab === 'avg') first.append(el('span', 'mu', ' ' + o.tm));
    }
    tr.append(first);
    for (const [, k, cell, , cls] of SEASON_COLS[tab]) tr.append(el('td', [cls, k && k === seasonState.sort[tab].k && 'k'].filter(Boolean).join(' ') || null, String(cell(o))));
    if (tab !== 'avg') {
      tr.title = 'Open ' + o.tm + (o.home ? ' vs ' : ' @ ') + o.op + ', ' + fmtDay(o.day);
      tr.onclick = e => { if (!e.target.closest('a')) openGameOn(o.day, o.gid); };
    }
    tb.append(tr);
  });
  tbl.append(thead, tb);
  wrap.append(tbl);
  return wrap;
}

// open a game from another day (season tables): a new history entry pointing at that day and game
function openGameOn(day, id) {
  pushNav();
  history.replaceState(null, '', '#d=' + day.replaceAll('-', '') + '&g=' + id);
  applyHash(false);
}

function syncSeasonControls() {
  const tab = seasonState.tab;
  $('#seasonTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === tab)));
  $('#seasonFind').hidden = tab === 'tg';
  $('#seasonAllWrap').hidden = tab !== 'avg';
  const sel = $('#seasonTeam');
  if (!sel.options.length) {
    sel.append(new Option('All teams', ''), new Option('Followed teams', '*'));
    TEAMS.forEach(t => sel.append(new Option(t, t)));

  sel.value = seasonState.team;
  $('#seasonFind').value = seasonState.find;
  $('#seasonAll').checked = seasonState.all;
}
$('#seasonTabs').querySelectorAll('button').forEach(b => (b.onclick = () => {
  if (seasonState.tab === b.dataset.s) return;
  pushNav(); seasonState.tab = b.dataset.s; syncSeasonControls(); writeHash(); loadSeason();
}));
$('#seasonTeam').onchange = e => { seasonState.team = e.target.value; loadSeason(); };
let findTimer = 0;
$('#seasonFind').oninput = e => { clearTimeout(findTimer); findTimer = setTimeout(() => { seasonState.find = e.target.value; loadSeason(); }, 250); };
$('#seasonAll').onchange = e => { seasonState.all = e.target.checked; loadSeason(); };

// ---------------------------------------------------------------- settings + data usage
const CHOICES = {
  live: [5, 10, 20, 30, 60], box: [30, 60, 120, 300], others: [30, 60, 120, 300], leaders: [30, 60, 120, 300],
};
const SET_LABELS = { live: 'Watched live game', box: 'Its box score', others: 'Other games (scores)', leaders: 'Game lists & top performers' };
const fmtSec = n => (n < 60 ? n + 's' : n / 60 + ' min');
const fmtB = b => (b < 1e3 ? Math.round(b) + ' B' : b < 1e6 ? Math.round(b / 1e3) + ' KB' : (b / 1e6).toFixed(b < 1e7 ? 1 : 0) + ' MB');

function renderSettings() {
  const box = $('#setControls');
  box.replaceChildren();
  for (const k of Object.keys(CHOICES)) {
    const lab = el('label', null, SET_LABELS[k]);
    const sel = el('select');
    for (const n of CHOICES[k]) sel.append(new Option('every ' + fmtSec(n), String(n)));
    sel.value = String(settings[k]);
    sel.disabled = k === 'box' && !settings.lite;
    sel.onchange = () => saveSetting(k, +sel.value);
    lab.append(sel);
    box.append(lab);
  }
  for (const [k, text] of [['breaks', 'Slow down during timeouts & breaks'], ['lite', 'Lightweight play updates']]) {
    const lab = el('label', 'ck');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = settings[k];
    cb.onchange = () => saveSetting(k, cb.checked);
    lab.append(cb, document.createTextNode(text));
    box.append(lab);
  }
  const fol = el('div', 'follow');
  fol.append(el('span', null, 'Followed teams'));
  const teams = el('div', 'teams');
  for (const t of TEAMS) {
    const b = el('button', null, t);
    b.setAttribute('aria-pressed', String(settings.follow.includes(t)));
    b.onclick = () => {
      settings.follow = settings.follow.includes(t) ? settings.follow.filter(x => x !== t) : [...settings.follow, t];
      b.setAttribute('aria-pressed', String(settings.follow.includes(t)));
      saveSettings();
      renderGames(); renderListing();
    };
    teams.append(b);
  }
  fol.append(teams);
  box.append(fol);
  const reset = el('button', null, 'Defaults');
  reset.onclick = () => { Object.assign(settings, DEFAULTS); saveSettings(); renderSettings(); renderGames(); renderListing(); retime(); };
  box.append(reset);
  renderUsage();
}

function saveSetting(k, v) {
  settings[k] = v;
  saveSettings();
  if (k === 'lite') renderSettings(); else renderUsage();
  retime();
}

// After a setting changes, bring forward any pending poll that is now further away than its new interval.
function retime() {
  const base = { sb: sec('others'), pbp: sec('live'), ld: sec('leaders') };
  for (const [k, d] of Object.entries(due)) if (d.at - Date.now() > base[k]) sched(k, d.fn, base[k]);
}

// Estimated bytes per minute, from the settings and the average response sizes seen so far.
function perMinute(kind, nLive) {
  const per = s => 60 / s;
  const scores = nLive > 0 ? per(settings.others) * SIZE.scoreboard : 0;
  if (kind === 'game') return scores + (settings.lite
    ? per(settings.live) * (SIZE.plays + SIZE.status) + per(Math.max(settings.box, settings.live)) * SIZE.summary
    : per(settings.live) * SIZE.summary);
  if (kind === 'leaders') return scores + nLive * per(settings.leaders) * SIZE.summary;
  return scores;
}

function renderUsage() {
  const box = $('#usage');
  const nLive = state.games.filter(g => g.state === 'in').length;
  const watching = state.view === 'game' && state.gameState === 'in';
  const now = document.hidden ? 0 : listing() ? perMinute('leaders', nLive) : perMinute(watching ? 'game' : 'scores', nLive);
  const nowWhat = state.view === 'season' ? 'Season stats (loaded once, no refresh)' : listing() ? ({ home: 'Home page', leaders: 'Top performers', game: 'All games' })[state.view] + ' with ' + nLive + ' live game' + (nLive === 1 ? '' : 's')
    : watching ? 'Watching ' + (state.away?.abbr || '') + '–' + (state.home?.abbr || '') + ' live'
    : nLive ? 'Scores only (' + nLive + ' live game' + (nLive === 1 ? '' : 's') + ')' : 'No live games: nothing to refresh';
  const tbl = el('table'), th = el('tr');
  ['Estimated data', 'per min', 'per hour', 'per game'].forEach(h => th.append(el('th', null, h)));
  const thead = el('thead'); thead.append(th);
  const tb = el('tbody');
  const row = (label, v, cls, sub) => {
    const tr = el('tr', cls), td = el('td', null, label);
    if (sub) td.append(el('span', 'sub', sub));
    tr.append(td, el('td', null, fmtB(v)), el('td', null, fmtB(v * 60)), el('td', null, fmtB(v * FULL_GAME_MIN)));
    tb.append(tr);
  };
  row('Right now', now, 'now', nowWhat);
  row('Watching one live game', perMinute('game', Math.max(1, nLive)));
  row('Home, all games or top performers, 5 live games', perMinute('leaders', 5));
  tbl.append(thead, tb);
  const used = el('p', 'muted', 'Used this visit: ' + fmtB(usage.bytes) + ' in ' + usage.requests + ' request' + (usage.requests === 1 ? '' : 's') +
    ' · since ' + new Date(usage.total.since).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ': ' + fmtB(usage.total.bytes) + ' ');
  const clr = el('button', null, 'Reset');
  clr.onclick = () => { usage.total = { since: Date.now(), bytes: 0 }; store.set('nbapbp.usage', usage.total); renderUsage(); };
  used.append(clr);
  box.replaceChildren(tbl, used);
}

function setView(v, load = true) {

  $('#leadersView').hidden = v !== 'leaders';
  $('#homeView').hidden = v !== 'home';
  $('#seasonView').hidden = v !== 'season';
  $('#navGame').setAttribute('aria-pressed', String(v === 'game'));
  $('#navLeaders').setAttribute('aria-pressed', String(v === 'leaders'));
  $('#navSeason').setAttribute('aria-pressed', String(v === 'season'));
  if (v === 'season') syncSeasonControls();
  stop('pbp'); stop('ld');
  syncMode(); writeHash(); renderGames();
  renderListing();
  if (!load) return;
  if (v === 'season') loadSeason();
  else if (listing()) loadLeaders(); else loadPBP();
}

function setTab(t) {
  state.tab = t;
  $('#gameView').dataset.tab = t;
  $('#tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));
  writeHash();
}

// URL: (nothing) home · #v=leaders · #v=season[&s=pg|tg] · #g=<id> game (#v=game before one is chosen) · #d=YYYYMMDD date · #t=box mobile tab
function writeHash() {
  const q = new URLSearchParams();
  if (state.view === 'leaders' || state.view === 'season') q.set('v', state.view);
  if (state.view === 'season' && seasonState.tab !== 'avg') q.set('s', seasonState.tab);
  if (state.view === 'game' && !state.gameId) q.set('v', 'game');
  if (state.date) q.set('d', state.date);
  if (state.view === 'game' && state.gameId) q.set('g', state.gameId);
  if (state.view === 'game' && state.tab === 'box') q.set('t', 'box');
  const h = q.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
// Start a new history entry for a user navigation; the code that follows updates it via writeHash()
const pushNav = () => history.pushState(null, '', location.href);

function parseHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const g = q.get('g');
  return { date: /^\d{8}$/.test(q.get('d') || '') ? q.get('d') : null, g,
    view: ['leaders', 'season'].includes(q.get('v')) ? q.get('v') : g || q.get('v') === 'game' ? 'game' : 'home',
    tab: q.get('t') === 'box' ? 'box' : 'plays', s: ['pg', 'tg'].includes(q.get('s')) ? q.get('s') : 'avg' };
}

// Apply the URL (page load, or browser Back/Forward)
async function applyHash(initial) {
  const h = parseHash();
  setTab(h.tab);
  seasonState.tab = h.s;
  if (initial || h.date !== state.date) {
    state.date = h.date;
    clearGame(h.view === 'game' ? 'Loading…' : '');
    $('#leaders').replaceChildren();
    if (h.g) state.gameId = h.g;
    setView(h.view, false);
    if (h.view === 'game' && h.g) loadPBP();
    if (h.view === 'season') loadSeason();
    await loadScoreboard();
    if (listing()) loadLeaders();
    return;
  }
  if (h.view === 'game' && h.g && h.g !== state.gameId) { setView('game', false); selectGame(h.g); }
  else { if (h.view === 'game' && !h.g && state.gameId) clearGame(); setView(h.view); }
}

function measureHeader() { document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px'); }
window.addEventListener('resize', measureHeader);

const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
async function changeDate(date) {
  pushNav();
  state.date = date;
  clearGame(state.view === 'game' ? 'Loading…' : '');
  $('#leaders').replaceChildren();
  await loadScoreboard();
  if (listing()) loadLeaders();
}
function shiftDay(n) {
  const base = new Date((state.dayDate || ymd(new Date()).replace(/(\d{4})(\d\d)(\d\d)/, '$1-$2-$3')) + 'T12:00:00');
  base.setDate(base.getDate() + n);
  changeDate(ymd(base));
}
const go = v => { if (state.view !== v) { pushNav(); setView(v); } };

$('#prev').onclick = () => shiftDay(-1);
$('#next').onclick = () => shiftDay(1);
$('#today').onclick = () => changeDate(null);
$('#logo').onclick = e => { e.preventDefault(); go('home'); };
$('#allLeaders').onclick = () => go('leaders');
// "Games" always shows the grid of all games, even from inside a game
$('#navGame').onclick = () => { if (state.view === 'game' && !state.gameId) return; pushNav(); clearGame(); setView('game'); };
$('#navLeaders').onclick = () => go('leaders');
$('#navSeason').onclick = () => go('season');
$('#tabs').querySelectorAll('button').forEach(b => (b.onclick = () => setTab(b.dataset.tab)));
$('#period').onchange = e => { state.period = e.target.value; renderPlays(); };
$('#order').onclick = e => { state.newest = !state.newest; e.target.textContent = state.newest ? 'Newest first' : 'Oldest first'; renderPlays(); };
window.addEventListener('popstate', () => applyHash(false));

// pause all polling while the tab is hidden; refresh immediately on return
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Object.keys(timers).forEach(stop); return; }
  loadScoreboard();
  if (state.view === 'game' && state.gameId) loadPBP();
  if (listing()) loadLeaders();
});

// restore from the URL, e.g. #d=20261122&g=401704123&t=box  or  #v=leaders&d=20261122
measureHeader();
applyHash(true);
</script>
</body>
</html>
